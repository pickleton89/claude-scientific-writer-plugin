# ─── ACCURACY VERIFICATION ───────────────────────────────────────────────────
# Capability keys consumed by skills/research-accuracy-verifier/.
# Live MCP wiring (Scite, PubMed, PMC) is now active.

verification:
  citation_existence:
    description: "Verify a citation exists; resolve DOI/PMID/PMCID; check journal-volume-year impossibility; flag retracted / corrected papers"
    primary:
      - tool: pubmed_search
        notes: "PubMed MCP — biomedical primary; returns abstract + metadata"
      - tool: search_literature  # Scite MCP (mcp__scite__search_literature)
        notes: >
          After identifier resolution succeeds, call with `dois=[<resolved DOI>]`
          (no `term`) to retrieve `editorialNotices` (retractions, corrections,
          expressions of concern). A clean DOI resolution does NOT exempt the
          citation from this check — retracted papers resolve cleanly. A non-empty
          `editorialNotices` field maps to verdict METADATA_MISMATCH (Stage 2).
          Canonical call shape documented at literature.citation_tallies.
    fallback:
      - tool: crossref_lookup
        notes: "Crossref REST via WebFetch — DOI resolution + journal ISSN start year for volume-year sanity"
      - tool: openalex_search
        notes: "OpenAlex API — broad coverage when topic crosses disciplines"
    local:
      - tool: resolve_citation.py
        notes: "skills/research-accuracy-verifier/scripts/ — offline shape + plausibility checks before live lookup"

  claim_alignment:
    description: "Verify cited source actually supports the claim attributed to it (Stage 3)"
    primary:
      - tool: pmc_fetch
        notes: "PMC open-access full text retrieval via WebFetch"
    fallback:
      - tool: paperclip search  # Paperclip CLI
        notes: >
          When PMC fetch returns paywall / 404, attempt OA full-text retrieval via
          `paperclip lookup doi <DOI>` (preferred when DOI is known) or
          `paperclip search "<title>" -n 1`. Read the relevant section files under
          `/papers/<id>/sections/` or grep `content.lines` for the claim phrase.
          Higher-fidelity than Scite snippets for claim-alignment because full
          context is available. Skip if cited paper is not in Paperclip's 4-source
          corpus (PMC + bioRxiv + medRxiv + arXiv). See literature.corpus_search.
      - tool: search_literature  # Scite MCP (mcp__scite__search_literature)
        notes: >
          Call with `dois=[<DOI>] + term=<key claim phrase>` for sentiment-classified
          citing snippets (supporting / contrasting / mentioning). Use supporting
          snippets as evidence for VERIFIED; contrasting snippets as evidence for
          CONTRADICTED or OVERGENERALIZED. Bias caveat: tag all sentiment results
          "per Scite classification" — see literature.citation_context notes
          for the documented bias toward 'mentioning'.
      - tool: pubmed_abstract
        notes: "Abstract-only check when full text unavailable; mark UNVERIFIED for full-text-required claims"

  cherry_picking:
    description: "Stage 4 Tier-3 cherry-picking detection — flag VERIFIED cite-claim pairs whose cited paper has a heavily contested citation tally"
    primary:
      - tool: search_literature  # Scite MCP (mcp__scite__search_literature)
        notes: >
          Call with `dois=[<cited DOI>]` (no `term`) to fetch tallies; compute
          USI = supporting / (supporting + contrasting). USI < 0.5 (matches
          deep-research's CONTESTED threshold) → emit OVERGENERALIZED finding
          flagging the implicit consensus framing (the narrow cite-claim pair
          remains VERIFIED). See literature.citation_tallies for canonical
          parameters and return shape.
    fallback: []

  exact_quote:
    description: "Exact-string + whitespace-normalized match of a quoted passage in source text (Stage 5)"
    # Routing within this capability (precedence): if the source is provided, run `local`
    # (verify_exact_quote.py) first. If sources_available == "none" or the local script
    # returns QUOTE_FABRICATED in biomedical context, escalate to `primary` (Paperclip
    # corpus grep) before falling back to `fallback` (web search).
    primary:
      - tool: paperclip grep  # Paperclip CLI
        notes: >
          When `sources_available == "none"` (biomedical context), or when verify_exact_quote.py
          returns QUOTE_FABRICATED for a quote that may simply be misattributed to the wrong
          paper, run a corpus-wide exact-phrase grep over full text: `paperclip grep -F
          "<exact passage>" /papers/`. Returns paper IDs and line refs across the entire
          indexed corpus — the discovered true source is recorded via the citation URL
          `https://citations.gxl.ai/papers/<doc_id>#L<n>` in the finding's `evidence[]`.
          Verdict stays `QUOTE_FABRICATED`; remediation guidance changes to "re-attribute
          to <discovered source>." See literature.corpus_grep for full CLI surface. Skip
          if non-biomedical or Paperclip absent.
    local:
      - tool: verify_exact_quote.py
        notes: "skills/research-accuracy-verifier/scripts/ — deterministic; returns QUOTE_VERIFIED|QUOTE_PARAPHRASED|QUOTE_FABRICATED. Run first when source is provided."
    fallback:
      - tool: web_search
        notes: "Quoted-phrase web search when no source provided and Paperclip unavailable / non-biomedical context."

  entity_sanity:
    description: "Stage 6 named-entity sanity (gene/protein/drug/cell-line/strain) — delegates to entity-resolution"
    delegate:
      - skill: entity-resolution
        notes: "Canonical resolver; HGNC/UniProt/Cellosaurus/Jackson via MCP tools"
    local:
      - tool: resolve_entity.py
        notes: "skills/research-accuracy-verifier/scripts/ — offline shape + known-collision check before delegation"

  internal_consistency:
    description: "Stage 7 internal consistency (refs ↔ inline citations, acronym definition order)"
    local:
      - tool: reconcile_references.py
        notes: "skills/research-accuracy-verifier/scripts/ — bibliography ↔ inline cite set diff"
      - tool: scan_acronyms.py
        notes: "skills/research-accuracy-verifier/scripts/ — undefined-first-use + expansion drift"
