    description: "Compound bioactivity and binding data"
    tooluniverse:
      - tool: chembl_bioactivity
        notes: "For target-specific: use target_chembl_id__exact (double underscore)"
      - tool: bindingdb_search
        notes: "Affinity reported in nM (not uM)"
    fallback: []
  clinical:
    description: "Clinical trial and approval status"
    tooluniverse:
      - tool: clinicaltrials_search
      - tool: fda_approval
    fallback: []
  safety:
    description: "Adverse events and drug safety"
    primary:
      - tool: query_open_targets_graphql  # Open Targets safety data
        notes: "Use target safety query from OT GraphQL schema"
    tooluniverse:
      - tool: sider_side_effects
      - tool: drugbank_get_safety
        notes: "ALL params required: query, case_sensitive, exact_match, limit"
    fallback: []
  admet:
    description: "ADMET prediction and metabolism"
    tooluniverse:
      - tool: admet_ai_predict
      - tool: drugbank_admet
    fallback: []
  label:
    description: "FDA drug label (DailyMed SPL) parsed sections"
    tooluniverse:
      - tool: DailyMed_search_spls
        notes: "Search by drug name; returns set_id for subsequent queries"
      - tool: DailyMed_parse_adverse_reactions
        notes: "Requires setid from DailyMed_search_spls"
      - tool: DailyMed_parse_dosing
        notes: "Requires setid"
      - tool: DailyMed_parse_drug_interactions
        notes: "Requires setid"
      - tool: DailyMed_parse_clinical_pharmacology
        notes: "Requires setid"
      - tool: DailyMed_parse_contraindications
        notes: "Requires setid"
    fallback: []
  faers:
    description: "FDA Adverse Event Reporting System post-marketing safety"
    tooluniverse:
      - tool: FAERS_count_reactions_by_drug_event
        notes: "Param is 'medicinalproduct' (not drug_name)"
      - tool: FAERS_count_seriousness_by_drug_event
        notes: "Param is 'medicinalproduct'"
      - tool: FAERS_count_outcomes_by_drug_event
        notes: "Param is 'medicinalproduct'"
      - tool: FAERS_count_death_related_by_drug
        notes: "Param is 'medicinalproduct'"
      - tool: FAERS_count_patient_age_distribution
        notes: "Param is 'medicinalproduct'"
    fallback: []
  pgx:
    description: "Pharmacogenomics associations and dosing guidelines"
    tooluniverse:
      - tool: PharmGKB_search_drugs
        notes: "Returns PharmGKB drug ID (PA...)"
      - tool: PharmGKB_get_drug_details
        notes: "Cross-references and related genes"
      - tool: PharmGKB_get_clinical_annotations
        notes: "Variant-drug associations with evidence levels"
      - tool: PharmGKB_get_dosing_guidelines
        notes: "CPIC/DPWG guideline recommendations"
    fallback:
      - tool: DailyMed_parse_clinical_pharmacology
        notes: "Fallback for PGx from FDA label"
  regulatory:
    description: "FDA Orange Book approval, patents, and exclusivity"
    tooluniverse:
      - tool: FDA_OrangeBook_search_drug
        notes: "Search by brand_name or generic_name"
      - tool: FDA_OrangeBook_get_approval_history
      - tool: FDA_OrangeBook_get_exclusivity
      - tool: FDA_OrangeBook_get_patent_info
      - tool: FDA_OrangeBook_check_generic_availability
    fallback: []
  chemistry:
    description: "Physicochemical properties and drug-likeness"
    tooluniverse:
      - tool: PubChem_get_compound_properties_by_CID
        notes: "MW, formula, XLogP, TPSA, HBD, HBA, rotatable bonds"
      - tool: ADMETAI_predict_physicochemical_properties
        notes: "SMILES passed as list: [\"SMILES_STRING\"]"
      - tool: ADMETAI_pred_solu_lipo_hydr
        notes: "Solubility, lipophilicity, hydration; SMILES as list"
    fallback: []

# ─── LITERATURE ──────────────────────────────────────────────────────────────

literature:
  search:
    description: "Literature search across databases"
    primary:
      - tool: search_articles  # PubMed MCP
        notes: "Structured search with field tags, MeSH, date filters"
      - tool: mcp__openalex__search_works  # OpenAlex MCP
        notes: >
          Cross-disciplinary primary — broad topic queries across 240M+ works (biomedical
          + non-biomedical). Use as the general-domain backbone alongside PubMed (biomedical)
          and Paperclip (full-text). Required across all deep-research modes/domains.
      - tool: mcp__openalex__search_by_topic  # OpenAlex MCP
        notes: "Topic-faceted retrieval using OpenAlex's curated topic taxonomy; preferred when query maps to a known field/concept rather than free-text keywords."
      - tool: search  # Consensus MCP (mcp__claude_ai_Consensus__search)
        notes: >
          Semantic search over 200M+ papers (Semantic Scholar + PubMed + Scopus + arXiv).
          Ranking uses server-side full-text indexing — surfaces papers where the key finding
          lives in methods/results, not just the abstract; real discovery advantage over
          PubMed/OpenAlex abstract-keyword search. Paper results are first-class citations.
          Do NOT cite Consensus's natural-language synthesis output as evidence — cite the
          underlying paper.
      - tool: search_literature  # Scite MCP (mcp__scite__search_literature)
        notes: "Full-text search over ~50M articles; use for claim-specific queries and citation context"
    tooluniverse:
      - tool: europe_pmc_search
        notes: "Includes full-text snippet extraction via extract_terms_from_fulltext"
      - tool: semantic_scholar_search
    fallback: []
  full_text:
    description: "Full-text article retrieval"
    primary:
      - tool: get_full_text_article  # PubMed MCP (PMC)
        notes: "Requires PMC ID; use convert_article_ids to get from PMID"
    tooluniverse:
      - tool: europe_pmc_fulltext
      - tool: semantic_scholar_pdf
    fallback: []
  full_text_snippets:
    description: "Full-text snippet extraction for targeted verification"
    tooluniverse:
      - tool: EuropePMC_get_fulltext_snippets
        notes: "Param is 'pmcid' (not PMID) + 'terms'; returns bounded text snippets from OA articles"
      - tool: SemanticScholar_get_pdf_snippets
        notes: "Param is 'open_access_pdf_url' + 'terms'; extracts snippets from OA PDFs"
    fallback:
      - tool: get_full_text_article  # PubMed MCP — full article if snippets unavailable
  recommendations:
    description: "AI-powered related paper recommendations"
    tooluniverse:
      - tool: SemanticScholar_get_recommendations
        notes: "Param is 'paper_id' (40-char hex Semantic Scholar ID); returns related papers"
    fallback: []
  citations:
    description: "Citation network traversal (forward/backward expansion + multi-hop graph)"
    primary:
      - tool: mcp__openalex__get_citation_network  # OpenAlex MCP
        notes: >
          Multi-hop citation graph (forward + backward) for snowballing. Required across
          all deep-research modes for cross-disciplinary citation expansion. Far broader
          coverage than PubMed find_related_articles (biomedical-only).
      - tool: mcp__openalex__get_work_citations  # OpenAlex MCP
        notes: "Forward citations (papers citing the target work); use when expanding from a seed paper to downstream literature."
      - tool: mcp__openalex__get_work_references  # OpenAlex MCP
        notes: "Backward citations (papers cited by the target work); use for tracing intellectual lineage."
      - tool: find_related_articles  # PubMed MCP
        notes: "Biomedical-only related-article retrieval; use as biomedical complement to OpenAlex citation tools."
    tooluniverse:
      - tool: EuropePMC_get_citations
        notes: "Forward citations from Europe PMC; param is article ID"
      - tool: semantic_scholar_citations
    fallback: []

  seminal_papers:
    description: "Discover landmark / foundational works in a research field"
    primary:
      - tool: mcp__openalex__find_seminal_papers  # OpenAlex MCP
        notes: >
          Returns landmark works ranked by citation impact + age within a field/topic.
          Required for early-stage deep-research scoping (Survey/Triage stages) when
          building intellectual context for a topic.
    tooluniverse: []
    fallback:
      - tool: mcp__openalex__get_top_cited_works
        notes: "Filterable top-cited works when find_seminal_papers returns sparse results."

  reviews:
    description: "Discover review articles and meta-analyses on a topic"
    primary:
      - tool: mcp__openalex__find_review_articles  # OpenAlex MCP
        notes: >
          Filters OpenAlex works to review articles (review type) on a topic.
          Required for deep-research Survey stage to anchor on existing syntheses
          before primary literature dive.
    tooluniverse: []
    fallback:
      - tool: search_articles  # PubMed MCP
        notes: "Use PubMed `Publication Type[pt]` filter for biomedical reviews when OpenAlex coverage is sparse."

  citation_context:
    description: "Citation context with sentiment classification (supporting/contrasting/mentioning)"
    primary:
      - tool: search_literature  # Scite MCP (mcp__scite__search_literature)
        notes: >
          Returns citing papers classified as supporting/contrasting/mentioning with ~3-sentence
          snippets. Use with `dois` + `term` to search within citing papers for specific claims.
          Accuracy caveat: independent evaluation found bias toward 'mentioning' — always note
          'per Scite classification' when reporting sentiment.
    tooluniverse: []
    fallback:
      - tool: find_related_articles  # PubMed MCP — no sentiment, but finds citing papers

  citation_tallies:
    description: "Per-paper citation breakdown by sentiment type (supporting/contrasting/mentioning)"
    primary:
      - tool: search_literature  # Scite MCP (mcp__scite__search_literature)
        notes: >
          Call with `dois` (no `term`) to fetch tallies. Returns: total, supporting, contrasting,
          mentioning, citingPublications counts + Scite Index (USI = supporting/(supporting+contrasting)).
          Also returns editorialNotices for retractions, corrections, expressions of concern.
    tooluniverse: []
    fallback: []  # No equivalent exists elsewhere — gracefully omit if unavailable

  corpus_search:
    description: "Full-text discovery + LLM map/reduce across the Paperclip 8-source corpus (PMC + bioRxiv + medRxiv + arXiv + abstracts + FDA + clinical trials + patents)"
    primary:
      - tool: paperclip search  # Paperclip CLI or MCP — see PAPERCLIP TRANSPORTS
        notes: >
          Full-text search across the 8-source corpus (pmc, biorxiv, medrxiv, arxiv,
          abstracts, fda, trials, patents — restrict with `-s <source>` or positional
          source token). Returns a session-local search ID `s_xxxxxxxx` (consumable by
          `paperclip results <ID>` and `paperclip map --from <ID>`). Search IDs are
          local trace handles, not globally reproducible — record citation URLs
          (`https://citations.gxl.ai/papers/<doc_id>#L<n>`) for durable audit trails.
          Add `-s abstracts` to widen to abstract-only corpus when full-text hits are
          sparse. Pair with PubMed MCP — Paperclip does NOT cover full MEDLINE.
      - tool: paperclip map  # Paperclip CLI or MCP — see PAPERCLIP TRANSPORTS
        notes: >
          `paperclip map --from <s_id> "<question>"` runs a per-paper LLM reader and emits
          a map result ID `m_xxxxxxxx`. Recommended at 3–10 papers (`-n 5` or `-n 10` on
          search). Follow with `paperclip reduce --from <m_id> --strategy {summarize|table|themes|consensus|bullet_points|extract}`.
    tooluniverse: []
    fallback:
      - tool: search_articles  # PubMed MCP
        notes: "PubMed search across MEDLINE when Paperclip CLI is absent; pair with `get_full_text_article` for PMC OA full text. Does not cover preprints (bioRxiv/medRxiv) or arXiv — those have no MCP equivalent."

  corpus_metadata:
    description: "Read-only SQL metadata queries over the Paperclip documents table (200-row cap)"
    primary:
      - tool: paperclip sql  # Paperclip CLI or MCP — see PAPERCLIP TRANSPORTS
        notes: >
          `paperclip sql "SELECT ... FROM documents WHERE ..."`. The query is fanned
          out across the 4 default sources (pmc, abstracts, fda_docs, trials) — each
          source has its own schema; some columns exist only in specific sources. Use
          `paperclip sql --tables -s <source>` to inspect available tables (e.g.,
          `fda_docs` exposes `accelerated_approvals`, `all_documents`, `pediatric_waivers`,
          ...). Common uses: pre-search coverage check (`SELECT COUNT(*) FROM documents
          WHERE source='fda' AND year>=2020`), filter by author/journal/license, or
          confirm a candidate DOI lives in the corpus before paying for `paperclip search`.
          200-row LIMIT enforced — use aggregation or `--quiet` for bulk counts.
    tooluniverse: []
    fallback: []  # No equivalent — degrade to omitting the pre-search filter

  corpus_grep:
    description: "Sub-second regex search across the Paperclip corpus (full text), or within a single paper"
    primary:
      - tool: paperclip grep  # Paperclip CLI or MCP — see PAPERCLIP TRANSPORTS
        notes: >
          Canonical full-text exact-phrase search across the entire indexed corpus:
          `paperclip grep -F "<exact passage>" /papers/`. Returns paper IDs and per-paper
          match counts with file paths and line numbers (`/papers/<id>/sections/<file>:L<n>`),
          which form the citation URL: `https://citations.gxl.ai/papers/<doc_id>#L<n>`.
          Within-paper grep: `paperclip grep -F "<pattern>" /papers/<id>/content.lines`.
          Use `bash 'search ... | grep ...'` ONLY to narrow search-result snippets (title +
          abstract preview), NOT to find exact passages in full text — that requires
          `paperclip grep` over `/papers/`. Sandbox (vsh) blocks `for`/`while`/`xargs` —
          use multiple tool calls instead of loops. SQL surface (`paperclip sql`) capped
          at 200 rows.
    tooluniverse: []
    fallback:
      - tool: web_search
        notes: "Quoted-phrase web search when Paperclip unavailable or claim is non-biomedical."

  entity_annotation:
    description: "Entity-grounded paper discovery + BioC-JSON annotations via NCBI PubTator3"
    primary:
      - tool: pubtator3 search  # skills/shared/scripts/pubtator3.py (invoke via `uv run python`)
        notes: >
          Annotated PubMed search keyed by typed entities (gene/disease/chemical/variant/species)
          and/or free text. Bare symbols are auto-tagged (`--gene BRAF` → `@GENE_BRAF`); pre-tagged
          tokens pass through. Combine entities with `--gene X --disease Y` (joined by AND).
          Add `--summary` for a token-cheap view (total + per-hit pmid/title/doi/year/score).
          Returns response with `count`, `total_pages`, and free `facets` (journal/type/year
          breakdowns). Pair with `paperclip lookup doi <DOI>` for full text. Far higher precision
          than `"BRAF" AND "melanoma"` keyword search because matches are ID-grounded, not
          string-matched. NCBI REST, ~20 req/s, no auth — wrapper enforces 50ms throttle +
          Retry-After-aware retry.
      - tool: pubtator3 annotations  # skills/shared/scripts/pubtator3.py
        notes: >
          BioC-JSON entity spans for a comma-separated PMID list (`--pmids P1,P2,P3`). Use to
          verify a cited paper actually annotates a (gene, disease, chemical) tuple BEFORE
          paying for full-text retrieval. `--summary` emits per-PMID entity-count tally
          (`{gene: {@GENE_BRAF: 15}, disease: {@DISEASE_Melanoma: 15}, ...}`). Caveat: absence
          from PubTator3 ≠ absence from paper — escalate to Paperclip full text rather than
          returning a hard verdict.
      - tool: pubtator3 relations  # skills/shared/scripts/pubtator3.py
        notes: >
          Co-mention / relation graph for an entity (`--entity @GENE_BRAF`). Returns flat
          array of `{type, source, target, publications}`. Default: omit `--type` and filter
          client-side (NCBI's type filter empirically returns `[]` for many valid combinations).
          Common types: `associate`, `negative_correlate`, `positive_correlate`, `treat`,
          `cause`, `inhibit`. `--summary` groups by type, top-N each. Use for dossier-building
          (gene → diseases / drugs co-mentioned).
    tooluniverse: []
    fallback:
      - tool: search_articles  # PubMed MCP
        notes: "Plain keyword search if PubTator3 endpoint is unreachable. No entity grounding — false positives on ambiguous symbols."
      - tool: search_literature  # Scite MCP
        notes: "Sentiment-classified citation snippets if you need claim-context evidence rather than entity annotations."

  entity_autocomplete:
    description: "Resolve free-text entity names to PubTator3 canonical IDs"
    primary:
      - tool: pubtator3 autocomplete  # skills/shared/scripts/pubtator3.py
        notes: >
          Free text → ranked PubTator3 entity ID candidates. Use BEFORE `pubtator3 search`
          or `pubtator3 annotations` to disambiguate. Optional `--concept` filter
          (gene|disease|chemical|variant|species) narrows results. Returns array of
          `{_id: "@GENE_BRAF", biotype, db_id, db, name, description, match}`. Disambiguation
          signal: if a query (e.g. "ACE") returns >1 concept type without `--concept`,
          flag as collision and escalate. Synonym-only matches (`match: "Matched on synonyms..."`)
          carry lower confidence than name matches.
    tooluniverse: []
    delegate:
      - skill: entity-resolution
        notes: "For full canonical-ID resolution with cross-reference validation across HGNC/UniProt/ChEMBL/Cellosaurus. PubTator3 autocomplete complements but does not replace the entity-resolution skill — it provides PubTator3-specific IDs for downstream search/annotations calls."

# ─── ML PREDICTIONS ──────────────────────────────────────────────────────────

