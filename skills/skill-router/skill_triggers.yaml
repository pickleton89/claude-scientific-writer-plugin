# ============================================================
# ROUTING CONFIGURATION
# ============================================================

routing_config:
  # Confidence thresholds
  high_confidence_threshold: 0.7    # Route directly without clarification
  low_confidence_threshold: 0.3     # Require clarification
  trigger_boost: 0.2                # Boost per regex trigger match (hardcoded in code)
  max_trigger_boost: 0.4            # Cap for total trigger boost (hardcoded in code)

  # Category defaults (fallback when no skill matches clearly)
  category_defaults:
    visual: visual-design
    document: scientific-writing
    research: deep-research
    analysis: statistical-analysis
    conversion: markitdown
    document_output: "document-skills:docx"
    brand: oligon-brand
    biological_research: entity-resolution

  # Disambiguation questions by category
  disambiguation:
    visual:
      - question: "Is this based on data/numbers?"
        yes_skill: plotting-libraries
        no_followup: "Is it a diagram or schematic?"
      - question: "Is it a diagram or schematic?"
        yes_skill: scientific-schematics
        no_followup: "Do you need AI-generated imagery?"
      - question: "Do you need AI-generated imagery?"
        yes_skill: generate-image
        no_skill: visual-design

    document:
      - question: "Is this a research paper or manuscript?"
        yes_skill: scientific-writing
        no_followup: "Is it a presentation or poster?"
      - question: "Is it a presentation?"
        yes_skill: scientific-slides
        no_followup: "Is it a poster?"
      - question: "Is it a poster?"
        yes_skill: research-posters
        no_skill: executive-summary

    research:
      - question: "Do you have an existing document and want to verify its accuracy / check for hallucinated citations?"
        yes_skill: research-accuracy-verifier
        no_followup: "Do you want a peer review of methodology, statistics, or reporting standards?"
      - question: "Do you want a peer review of methodology, statistics, or reporting standards?"
        yes_skill: peer-review
        no_followup: "Do you need to generate or explore ideas with structured methods (stuck, contradiction, design space)?"
      - question: "Do you need to generate or explore ideas with structured methods (stuck, contradiction, design space)?"
        yes_skill: scientific-brainstorming
        no_followup: "Do you need research, literature review, or hypothesis generation?"
      - question: "Do you need research, literature review, or hypothesis generation?"
        yes_skill: deep-research
        no_followup: "Is this about managing citations/references?"
      - question: "Is this about managing citations/references?"
        yes_skill: citation-management
        no_skill: deep-research

    biological_research:
      - question: "Are you looking to resolve or disambiguate an entity (gene, drug, disease)?"
        yes_skill: entity-resolution
        no_followup: "Is this about a specific gene/protein target?"
      - question: "Is this about a specific gene/protein target?"
        yes_skill: target-intelligence
        no_followup: "Is this about a specific drug or compound?"
      - question: "Is this about a specific drug or compound?"
        yes_skill: drug-intelligence
        no_skill: target-validation

    brand:
      - question: "Are you applying Oligon brand standards?"
        yes_skill: oligon-brand
        no_skill: visual-design

    analysis:
      - question: "Do you need statistical test guidance or power analysis?"
        yes_skill: statistical-analysis
        no_followup: "Is this about reproducibility or environment setup?"
      - question: "Is this about reproducibility or environment setup?"
        yes_skill: reproducible-research
        no_skill: code-documentation

    conversion:
      - question: "Are you converting a file to Markdown?"
        yes_skill: markitdown
        no_skill: paper-2-web

    document_output:
      - question: "Do you need a Word document (.docx)?"
        yes_skill: "document-skills:docx"
        no_followup: "Do you need PDF, PowerPoint, or Excel?"
      - question: "Do you need PDF, PowerPoint, or Excel?"
        yes_skill: "document-skills:pdf"
