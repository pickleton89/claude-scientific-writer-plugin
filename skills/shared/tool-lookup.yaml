      - tool: FAERS_count_seriousness_by_drug_event
        notes: "Param is 'medicinalproduct'"
      - tool: FAERS_count_outcomes_by_drug_event
        notes: "Param is 'medicinalproduct'"
      - tool: FAERS_count_death_related_by_drug
        notes: "Param is 'medicinalproduct'"
      - tool: FAERS_count_patient_age_distribution
        notes: "Param is 'medicinalproduct'"
    fallback: []
  pgx:
    description: "Pharmacogenomics associations and dosing guidelines"
    tooluniverse:
      - tool: PharmGKB_search_drugs
        notes: "Returns PharmGKB drug ID (PA...)"
      - tool: PharmGKB_get_drug_details
        notes: "Cross-references and related genes"
      - tool: PharmGKB_get_clinical_annotations
        notes: "Variant-drug associations with evidence levels"
      - tool: PharmGKB_get_dosing_guidelines
        notes: "CPIC/DPWG guideline recommendations"
