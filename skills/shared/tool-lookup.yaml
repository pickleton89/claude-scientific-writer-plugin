  binding:
    description: "Protein-ligand binding prediction"
    tooluniverse:
      - tool: boltz2_predict
    fallback: []
  admet:
    description: "ADMET property prediction via ML"
    # Same tool as drug_data.admet; listed here for ML-prediction-focused queries
    tooluniverse:
      - tool: admet_ai_predict
    fallback: []

# ─── VISUALIZATION DATA FEEDS ──────────────────────────────────────────────
# Data sources for plotting-libraries and scientific-schematics.
# Pattern: ToolUniverse fetches data → existing skill renders it.
# No server-side visualization rendering in ToolUniverse.

visualization_data:
  expression_heatmap:
    description: "Tissue expression data for heatmap/barplot visualization"
    tooluniverse:
      - tool: gtex_get_median_gene_expression
        notes: "Requires gencode_id + operation='median'; returns TPM per tissue"
      - tool: hpa_get_rna_expression_by_source
        notes: "Requires gene_name + source_type + source_name (ALL three mandatory)"
    fallback: []
  ppi_network:
    description: "Protein interaction data for network graph visualization"
    tooluniverse:
      - tool: string_interactions
        notes: "protein_ids must be array; species=9606; returns confidence-scored edges"
      - tool: intact_search
        notes: "Returns binary interactions with MI scores"
