name: oligon-brand auto-sync

# Opens a PR when oligon-brand-core has advanced past the SHA currently vendored
# into skills/oligon-brand/. Pull-based: never pushes to master directly — it
# regenerates the vendored skill from core@latest and files a PR for human review
# + version bump (the /ship gate). The drift guard then validates that PR.
#
# Requires repo secret OLIGON_BRAND_CORE_TOKEN: a fine-grained PAT with read
# access to pickleton89/oligon-brand-core (same secret the drift guard uses).

on:
  schedule:
    - cron: '0 14 * * 1'      # Mondays 14:00 UTC (~07:00 MST)
  workflow_dispatch: {}        # manual "sync now" button

permissions:
  contents: write              # push the sync branch
  pull-requests: write         # open the PR

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gate on core-token availability
        id: gate
        env:
          CORE_TOKEN: ${{ secrets.OLIGON_BRAND_CORE_TOKEN }}
        run: |
          if [ -z "${CORE_TOKEN:-}" ]; then
            echo "::warning::OLIGON_BRAND_CORE_TOKEN not set — skipping auto-sync."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone core@latest and compare against current pin
        if: steps.gate.outputs.run == 'true'
        id: core
        env:
          CORE_TOKEN: ${{ secrets.OLIGON_BRAND_CORE_TOKEN }}
        run: |
          set -euo pipefail
          git clone --quiet "https://x-access-token:${CORE_TOKEN}@github.com/pickleton89/oligon-brand-core.git" /tmp/core
          NEW_SHA=$(git -C /tmp/core rev-parse --short HEAD)
          CUR_SHA=$(grep -oE 'oligon-brand-core@[0-9a-f]+' skills/oligon-brand/SKILL.md | head -1 | cut -d@ -f2)
          echo "new=$NEW_SHA" >> "$GITHUB_OUTPUT"
          echo "cur=$CUR_SHA" >> "$GITHUB_OUTPUT"
          if [ "$NEW_SHA" = "$CUR_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already at core@$CUR_SHA — nothing to sync."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate vendored skill from core@latest
        if: steps.gate.outputs.run == 'true' && steps.core.outputs.changed == 'true'
        run: bash scripts/sync_brand_core.sh /tmp/core

      - name: Commit to sync branch and open PR
        if: steps.gate.outputs.run == 'true' && steps.core.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW: ${{ steps.core.outputs.new }}
          CUR: ${{ steps.core.outputs.cur }}
        run: |
          set -euo pipefail
          # Banner advanced but regenerated content is byte-identical? Nothing to PR.
          if git diff --quiet -- skills/oligon-brand; then
            echo "No file changes after regeneration; skipping PR."; exit 0
          fi
          BRANCH="auto/oligon-brand-sync-${NEW}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add skills/oligon-brand
          git commit -m "chore(oligon-brand): vendor oligon-brand-core@${NEW}"
          git push -f -u origin "$BRANCH"
          if gh pr view "$BRANCH" >/dev/null 2>&1; then
            echo "PR already open for $BRANCH — updated in place."
          else
            gh pr create --base master --head "$BRANCH" \
              --title "chore(oligon-brand): sync core ${CUR} → ${NEW}" \
              --label automated \
              --body "Automated re-vendor of \`oligon-brand-core\` into \`skills/oligon-brand/\`.

          - Previous pin: \`oligon-brand-core@${CUR}\`
          - New pin: \`oligon-brand-core@${NEW}\`

          Generated by \`scripts/sync_brand_core.sh\`. **Review the diff, bump the plugin version + CHANGELOG (the /ship gate), then merge.** The drift guard validates this PR automatically."
          fi
