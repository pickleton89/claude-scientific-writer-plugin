  - request: "Visualize this"
    expected_skill: plotting-libraries
    max_confidence: 0.7
    notes: "Needs clarification on visualization type"

# ============================================================
# NEGATIVE CASES (should NOT route to certain skills)
# ============================================================

negative_cases:
  - request: "Create a flowchart showing my data pipeline"
    expected_skill: scientific-schematics
    not_expected: plotting-libraries
    min_confidence: 0.5
    notes: "Flowchart trumps data keyword"

  - request: "Draw a diagram of the experimental setup"
    expected_skill: scientific-schematics
    not_expected: generate-image
    min_confidence: 0.5
    notes: "Diagram keyword routes to schematics"

  - request: "Quick search for 5 papers on CRISPR"
    expected_skill: paper-search
    not_expected: literature-review
    min_confidence: 0.5
    notes: "Quick/few papers goes to paper-search"

  - request: "Comprehensive systematic review of the field"
    expected_skill: literature-review
    not_expected: paper-search
    min_confidence: 0.5
    notes: "Systematic/comprehensive goes to literature-review"

  - request: "Create a CONSORT flowchart"
    expected_skill: scientific-schematics
    not_expected: paperbanana
    min_confidence: 0.5
    notes: "Specific diagram type goes to schematics, not paperbanana"

  - request: "Plot this data as a bar chart"
    expected_skill: plotting-libraries
    not_expected: paperbanana
    min_confidence: 0.5
    notes: "Data visualization goes to plotting-libraries, not paperbanana"
