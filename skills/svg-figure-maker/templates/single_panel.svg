<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480">
  <title>REPLACE: one-line figure title for accessibility</title>
  <desc>REPLACE: two-sentence alt text describing the takeaway message and the key supporting evidence. Example: "Treatment X reduced tumor volume by 60% over 12 weeks compared to control; combination therapy with drug Y achieved 85% reduction."</desc>

  <g id="canvas-background">
    <rect x="0" y="0" width="640" height="480" fill="#FFFFFF"/>
  </g>

  <g id="panel-frame">
    <!-- panel boundary: 32px margin on all sides → inner 576 × 416 plot area -->
    <rect x="32" y="32" width="576" height="416" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  </g>

  <g id="panel-content" font-family="Arial, Helvetica, sans-serif">
    <!-- REPLACE: figure content here.
         Conventions:
           - all coords divisible by 8
           - all hex from oligon-brand/tokens/brand-tokens.json
           - all <text> carries font-family (inherited from this <g>) and an explicit font-size from {10,12,14,16}pt
           - stroke widths from {0.5, 1.0, 1.5, 2.0, 3.0}
    -->

    <text x="320" y="48" font-size="16pt" font-weight="bold" text-anchor="middle" fill="#222222">
      REPLACE: figure title
    </text>

    <text x="320" y="240" font-size="12pt" text-anchor="middle" fill="#666666">
      REPLACE: figure content
    </text>

    <text x="320" y="448" font-size="10pt" text-anchor="middle" fill="#666666">
      REPLACE: axis label or caption
    </text>
  </g>
</svg>
