    fallback: []
  claim_check_disease:
    description: "Verify gene-disease association claims"
    primary:
      - tool: query_open_targets_graphql
        notes: "Overall association score; evidence by data type"
    tooluniverse:
      - tool: CTD_get_gene_diseases
        notes: "Complementary gene-disease associations with inference scores"
    fallback: []
  claim_check_variant:
    description: "Verify variant frequency claims"
    tooluniverse:
      - tool: gnomad_variant
        notes: "Population allele frequencies; check against claimed rarity"
    fallback: []
  accession_validation:
