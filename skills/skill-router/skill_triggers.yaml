# ============================================================
# ROUTING CONFIGURATION
# ============================================================

routing_config:
  # Confidence thresholds
  high_confidence_threshold: 0.7    # Route directly without clarification
  low_confidence_threshold: 0.3     # Require clarification
  trigger_boost: 0.2                # Boost per regex trigger match (hardcoded in code)
  max_trigger_boost: 0.4            # Cap for total trigger boost (hardcoded in code)

  # Category defaults (fallback when no skill matches clearly)
  category_defaults:
    visual: visual-design
    document: scientific-writing
    research: paper-search
    analysis: statistical-analysis
    conversion: markitdown
    document_output: "document-skills:docx"
    brand: oligon-brand
    biological_research: entity-resolution

  # Disambiguation questions by category
  disambiguation:
    visual:
      - question: "Is this based on data/numbers?"
        yes_skill: plotting-libraries
        no_followup: "Is it a diagram or schematic?"
      - question: "Is it a diagram or schematic?"
        yes_skill: scientific-schematics
        no_followup: "Do you need AI-generated imagery?"
      - question: "Do you need AI-generated imagery?"
        yes_skill: generate-image
        no_skill: visual-design

    document:
      - question: "Is this a research paper or manuscript?"
        yes_skill: scientific-writing
        no_followup: "Is it a presentation or poster?"
      - question: "Is it a presentation?"
        yes_skill: scientific-slides
        no_followup: "Is it a poster?"
      - question: "Is it a poster?"
        yes_skill: research-posters
        no_skill: executive-summary

    research:
      - question: "Do you need a quick search (1-50 papers)?"
        yes_skill: paper-search
        no_followup: "Is this a systematic/comprehensive review?"
      - question: "Is this a systematic/comprehensive review?"
        yes_skill: literature-review
        no_skill: citation-management

    biological_research:
      - question: "Are you looking to resolve or disambiguate an entity (gene, drug, disease)?"
        yes_skill: entity-resolution
        no_followup: "Is this about a specific gene/protein target?"
      - question: "Is this about a specific gene/protein target?"
        yes_skill: target-intelligence
        no_followup: "Is this about a specific drug or compound?"
      - question: "Is this about a specific drug or compound?"
        yes_skill: drug-intelligence
        no_skill: target-validation
