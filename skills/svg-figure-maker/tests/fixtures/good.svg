<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480">
  <title>Good fixture — preflight should pass</title>
  <desc>A minimal brand-compliant SVG figure: viewBox set, accessibility tags present, font-family declared, font-size on ladder, palette hexes only, all coords on the 8px grid.</desc>

  <g id="canvas-background">
    <rect x="0" y="0" width="640" height="480" fill="#FFFFFF"/>
  </g>

  <g id="content" font-family="Arial, Helvetica, sans-serif">
    <text x="320" y="64" font-size="16pt" font-weight="bold" text-anchor="middle" fill="#000000">
      Brand-compliant SVG
    </text>
    <text x="320" y="240" font-size="12pt" text-anchor="middle" fill="#2DB2E8">
      All checks should pass
    </text>
    <text x="320" y="424" font-size="10pt" text-anchor="middle" fill="#000000">
      Tick label / annotation
    </text>
  </g>
</svg>
