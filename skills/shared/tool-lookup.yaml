      - tool: DailyMed_parse_adverse_reactions
        notes: "Requires setid from DailyMed_search_spls"
      - tool: DailyMed_parse_dosing
        notes: "Requires setid"
      - tool: DailyMed_parse_drug_interactions
        notes: "Requires setid"
      - tool: DailyMed_parse_clinical_pharmacology
        notes: "Requires setid"
