# ─── LITERATURE ──────────────────────────────────────────────────────────────

literature:
  search:
    description: "Literature search across databases"
    primary:
      - tool: search_articles  # PubMed MCP
        notes: "Structured search with field tags, MeSH, date filters"
      - tool: search  # Consensus MCP (mcp__claude_ai_Consensus__search)
        notes: "Semantic search over 200M+ papers"
      - tool: search_literature  # Scite MCP (mcp__scite__search_literature)
        notes: "Full-text search over ~50M articles; use for claim-specific queries and citation context"
    tooluniverse:
      - tool: europe_pmc_search
        notes: "Includes full-text snippet extraction via extract_terms_from_fulltext"
      - tool: semantic_scholar_search
    fallback: []
  full_text:
    description: "Full-text article retrieval"
    primary:
      - tool: get_full_text_article  # PubMed MCP (PMC)
        notes: "Requires PMC ID; use convert_article_ids to get from PMID"
    tooluniverse:
      - tool: europe_pmc_fulltext
      - tool: semantic_scholar_pdf
    fallback: []
  full_text_snippets:
    description: "Full-text snippet extraction for targeted verification"
    tooluniverse:
      - tool: EuropePMC_get_fulltext_snippets
        notes: "Param is 'pmcid' (not PMID) + 'terms'; returns bounded text snippets from OA articles"
      - tool: SemanticScholar_get_pdf_snippets
        notes: "Param is 'open_access_pdf_url' + 'terms'; extracts snippets from OA PDFs"
    fallback:
      - tool: get_full_text_article  # PubMed MCP — full article if snippets unavailable
  recommendations:
    description: "AI-powered related paper recommendations"
    tooluniverse:
      - tool: SemanticScholar_get_recommendations
        notes: "Param is 'paper_id' (40-char hex Semantic Scholar ID); returns related papers"
    fallback: []
  citations:
    description: "Citation network traversal"
    primary:
      - tool: find_related_articles  # PubMed MCP
    tooluniverse:
      - tool: EuropePMC_get_citations
        notes: "Forward citations from Europe PMC; param is article ID"
      - tool: openalex_citations
      - tool: semantic_scholar_citations
    fallback: []

  citation_context:
    description: "Citation context with sentiment classification (supporting/contrasting/mentioning)"
    primary:
      - tool: search_literature  # Scite MCP (mcp__scite__search_literature)
        notes: >
          Returns citing papers classified as supporting/contrasting/mentioning with ~3-sentence
          snippets. Use with `dois` + `term` to search within citing papers for specific claims.
          Accuracy caveat: independent evaluation found bias toward 'mentioning' — always note
          'per Scite classification' when reporting sentiment.
    tooluniverse: []
    fallback:
      - tool: find_related_articles  # PubMed MCP — no sentiment, but finds citing papers

  citation_tallies:
    description: "Per-paper citation breakdown by sentiment type (supporting/contrasting/mentioning)"
    primary:
      - tool: search_literature  # Scite MCP (mcp__scite__search_literature)
        notes: >
          Call with `dois` (no `term`) to fetch tallies. Returns: total, supporting, contrasting,
          mentioning, citingPublications counts + Scite Index (USI = supporting/(supporting+contrasting)).
          Also returns editorialNotices for retractions, corrections, expressions of concern.
    tooluniverse: []
    fallback: []  # No equivalent exists elsewhere — gracefully omit if unavailable

  corpus_search:
    description: "Full-text discovery + LLM map/reduce across the Paperclip corpus (PMC + bioRxiv + medRxiv + arXiv)"
    primary:
      - tool: paperclip search  # Paperclip CLI (invoke via Bash)
        notes: >
          Full-text search across PMC + bioRxiv + medRxiv + arXiv (4 sources). Returns
          a session-local search ID `s_xxxxxxxx` (consumable by `paperclip results <ID>`
          and `paperclip map --from <ID>`). Search IDs are local trace handles, not
          globally reproducible — record citation URLs (`https://citations.gxl.ai/papers/<doc_id>#L<n>`)
          for durable audit trails. Add `-s abstracts` to widen to abstract-only corpus
          when full-text hits are sparse. Pair with PubMed MCP — Paperclip does NOT cover
          full MEDLINE.
      - tool: paperclip map  # Paperclip CLI
        notes: >
          `paperclip map --from <s_id> "<question>"` runs a per-paper LLM reader and emits
          a map result ID `m_xxxxxxxx`. Recommended at 3–10 papers (`-n 5` or `-n 10` on
          search). Follow with `paperclip reduce --from <m_id> --strategy {summarize|table|themes|consensus|bullet_points|extract}`.
    tooluniverse: []
    fallback:
      - tool: search_preprints  # bioRxiv MCP
        notes: "If Paperclip CLI is absent, use bioRxiv MCP `search_preprints` (preprints) and PubMed MCP `search_articles` + `get_full_text_article` (PMC OA). arXiv full text has no MCP equivalent — falls back to direct WebFetch on arxiv.org."
      - tool: search_articles  # PubMed MCP
        notes: "PubMed search across MEDLINE; pair with `get_full_text_article` for PMC OA full text. Does not cover preprints — combine with `search_preprints`."

  corpus_grep:
    description: "Sub-second regex search across the Paperclip corpus (full text), or within a single paper"
    primary:
      - tool: paperclip grep  # Paperclip CLI (invoke via Bash)
        notes: >
          Canonical full-text exact-phrase search across the entire indexed corpus:
          `paperclip grep -F "<exact passage>" /papers/`. Returns paper IDs and per-paper
          match counts with file paths and line numbers (`/papers/<id>/sections/<file>:L<n>`),
          which form the citation URL: `https://citations.gxl.ai/papers/<doc_id>#L<n>`.
          Within-paper grep: `paperclip grep -F "<pattern>" /papers/<id>/content.lines`.
          Use `bash 'search ... | grep ...'` ONLY to narrow search-result snippets (title +
          abstract preview), NOT to find exact passages in full text — that requires
          `paperclip grep` over `/papers/`. Sandbox (vsh) blocks `for`/`while`/`xargs` —
          use multiple tool calls instead of loops. SQL surface (`paperclip sql`) capped
          at 200 rows.
    tooluniverse: []
    fallback:
      - tool: web_search
        notes: "Quoted-phrase web search when Paperclip unavailable or claim is non-biomedical."

