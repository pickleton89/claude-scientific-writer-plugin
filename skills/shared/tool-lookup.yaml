# tool-lookup.yaml — Capability-to-Tool Mapping
# Version: 1.5.0
#
# Skills reference capability KEYS (e.g., "disambiguation.gene_to_ensembl"),
# not raw tool names. This lookup resolves capabilities to tools with
# preference tiers:
#   primary   — Existing MCP (Open Targets, PubMed, Consensus). Always preferred.
#   tooluniverse — ToolUniverse MCP tools. Used when primary unavailable or
#                  when capability has no primary equivalent.
#   fallback  — Alternative tools or manual approaches.
#
# Convention: tools listed in order of preference within each tier.
# Tool naming: Use ToolUniverse canonical names (PascalCase, e.g.,
#   GPCRdb_get_protein, DailyMed_search_spls). Some Phase 1 entries
#   use lowercase shorthand (e.g., interpro_protein); both resolve
#   correctly. See known_param_corrections.md for canonical mappings.

# ─── ENTITY DISAMBIGUATION ───────────────────────────────────────────────────

disambiguation:
  gene_to_ensembl:
    description: "Resolve gene symbol/name to Ensembl Gene ID"
    primary:
      - tool: search_entities  # Open Targets MCP
        notes: "Returns Ensembl ID directly; pass entity_names=['target']"
    tooluniverse:
      - tool: mygene_query
        notes: "query parameter (not 'q'); returns Ensembl, Entrez, UniProt"
      - tool: ensembl_lookup_gene
        notes: "Requires gene_id + species='homo_sapiens'; response in data wrapper"
    fallback:
      - tool: hgnc_search
        notes: "HGNC REST API; reliable for official gene symbols"

  compound_to_chembl:
    description: "Resolve drug/compound name to ChEMBL ID"
    primary:
      - tool: search_entities  # Open Targets MCP
        notes: "Pass entity_names=['drug']; returns ChEMBL ID"
    tooluniverse:
      - tool: chembl_molecule_search
        notes: "Search by name, synonym, or trade name"
      - tool: pubchem_cid_lookup
        notes: "Returns PubChem CID; cross-reference to ChEMBL via ID mapping"
    fallback:
      - tool: drugbank_search
      - tool: chemspider_search

  disease_to_efo:
    description: "Resolve disease name to EFO/MONDO ID"
    primary:
      - tool: search_entities  # Open Targets MCP
        notes: "Pass entity_names=['disease']; returns EFO or MONDO ID"
    tooluniverse:
      - tool: open_targets_disease_search
        notes: "Skip if primary MCP available (redundant)"
    fallback: []

  protein_to_uniprot:
    description: "Resolve protein name to UniProt accession"
    tooluniverse:
      - tool: uniprot_search
        notes: "Search by protein name, gene symbol, or accession"
      - tool: uniprot_id_mapping
        notes: "Convert between ID types (Ensembl <-> UniProt <-> PDB)"
    fallback: []

# ─── TARGET BIOLOGY ──────────────────────────────────────────────────────────

target_structure:
  domains:
    description: "Protein domain architecture"
    tooluniverse:
      - tool: interpro_protein
      - tool: pfam_search
    fallback: []
  three_d:
    description: "3D structure data"
    tooluniverse:
      - tool: pdb_search
      - tool: alphafold_get_prediction
        notes: "Parameter is 'qualifier', not 'uniprot_accession'"
    fallback: []
  binding_sites:
    description: "Binding pocket and active site identification"
    tooluniverse:
      - tool: proteins_plus_dogsite
    fallback: []

target_biology:
  gpcr_detection:
    description: "GPCR target detection and specialized data (~35% of approved drug targets)"
    tooluniverse:
      - tool: GPCRdb_get_protein
        notes: "operation='get_protein', protein='{symbol_lower}_human'"
      - tool: GPCRdb_get_structures
        notes: "Returns active/inactive state structures"
      - tool: GPCRdb_get_ligands
        notes: "Curated agonists, antagonists, allosteric modulators"
      - tool: GPCRdb_get_mutations
        notes: "Mutation data with Ballesteros-Weinstein numbering"
    fallback: []
  druggability_class:
    description: "Target development level and druggability classification"
    tooluniverse:
      - tool: Pharos_get_target
        notes: "Returns TDL (Tclin/Tchem/Tbio/Tdark), protein family, novelty score"
      - tool: DGIdb_get_gene_druggability
        notes: "Gene druggability categories and interaction counts"
    fallback: []
  assay_data:
    description: "High-throughput screening and assay results for target"
    tooluniverse:
      - tool: PubChem_search_assays_by_target_gene
        notes: "Returns HTS assay summaries for gene target"
    fallback: []
  disease_complement:
    description: "Complementary disease associations from Comparative Toxicogenomics Database"
    tooluniverse:
      - tool: CTD_get_gene_diseases
        notes: "Param is 'input_terms' (not 'gene'); returns gene-disease associations with inference scores"
    fallback: []

expression:
  tissue:
    description: "Tissue-level gene expression"
    tooluniverse:
      - tool: gtex_get_median_gene_expression
        notes: "Requires gencode_id + operation='median'; try unversioned ID if versioned fails"
      - tool: hpa_tissue
    fallback: []
  single_cell:
    description: "Single-cell expression data"
    tooluniverse:
      - tool: hpa_single_cell
      - tool: hpa_get_rna_expression_by_source
        notes: "Requires gene_name + source_type + source_name (ALL three mandatory)"
    fallback: []

interactions:
  go_annotations:
    description: "Gene Ontology annotations for biological process, molecular function, cellular component"
    tooluniverse:
      - tool: GO_get_annotations_for_gene
        notes: "Param is 'gene_id' (accepts gene symbol); returns GO terms with evidence codes"
    fallback: []
  ppi:
    description: "Protein-protein interactions"
    tooluniverse:
      - tool: string_interactions
        notes: "protein_ids must be array; species=9606 for human"
      - tool: intact_search
    fallback: []
  pathways:
    description: "Biological pathway context"
    tooluniverse:
      - tool: reactome_pathways
        notes: "UniProt → pathways via Reactome_map_uniprot_to_pathways (param is 'id', not 'uniprot_id')"
      - tool: kegg_pathway
    fallback: []

genetic_variation:
  population:
    description: "Population frequency and constraint data"
    tooluniverse:
      - tool: gnomad_variant
      - tool: gnomad_get_gene_constraints
        notes: "Uses gene_symbol, not gene_id"
      - tool: clinvar_search
    fallback: []
  essentiality:
    description: "Gene essentiality screens (CRISPR knockout data)"
    tooluniverse:
      - tool: DepMap_get_gene_dependencies
        notes: "Uses gene_symbol, not gene_id; negative scores = essential"
      - tool: DepMap_search_genes
        notes: "Search gene names to confirm DepMap availability"
    fallback: []

