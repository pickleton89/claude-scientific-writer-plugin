# Skill Trigger Registry
# Version: 1.1.0
# Purpose: Deterministic keyword-based routing for the 27-skill scientific writing library
#
# Structure:
#   keywords: Common terms that indicate this skill (weighted equally)
#   triggers: Regex patterns for stronger matches (boost confidence by 0.3)
#   category: Primary task category for fallback routing
#   output_formats: File formats this skill can produce
#   negative_keywords: Terms that indicate this skill should NOT be used

skills:
  # ============================================================
  # VISUAL CREATION SKILLS
  # ============================================================

  plotting-libraries:
    description: Data visualization with matplotlib, seaborn, ggplot2, plotly
    category: visual
    keywords:
      - plot
      - chart
      - graph
      - histogram
      - scatter
      - heatmap
      - visualization
      - visualize
      - figure
      - data
      - bar chart
      - line plot
      - box plot
      - violin plot
      - volcano plot
      - pca
      - umap
      - seaborn
      - matplotlib
      - ggplot
      - ggplot2
      - plotly
      - data figure
      - statistical plot
    triggers:
      - "visualize"
      - "plot"
      - "chart"
      - "graph"
      - "histogram"
      - "heatmap"
      - "(bar|line|scatter|box|violin)\\s*(chart|plot|graph)"
      - "correlation.*matrix"
      - "(pca|umap|tsne).*plot"
    output_formats: [png, svg, pdf, html]
    negative_keywords:
      - diagram
      - schematic
      - flowchart
      - workflow
      - mechanism
      - pathway
      - graphical abstract
      - visual abstract
      - visual summary
      - figure from paper
      - figure from text
