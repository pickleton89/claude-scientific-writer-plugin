# ─── ACCURACY VERIFICATION ───────────────────────────────────────────────────
# Capability keys consumed by skills/research-accuracy-verifier/.
# Live MCP wiring (Scite, PubMed, PMC) is now active.

verification:
  citation_existence:
    description: "Verify a citation exists; resolve DOI/PMID/PMCID; check journal-volume-year impossibility; flag retracted / corrected papers"
    primary:
      - tool: pubmed_search
        notes: "PubMed MCP — biomedical primary; returns abstract + metadata"
      - tool: search_literature  # Scite MCP (mcp__scite__search_literature)
        notes: >
          After identifier resolution succeeds, call with `dois=[<resolved DOI>]`
          (no `term`) to retrieve `editorialNotices` (retractions, corrections,
          expressions of concern). A clean DOI resolution does NOT exempt the
          citation from this check — retracted papers resolve cleanly. A non-empty
          `editorialNotices` field maps to verdict METADATA_MISMATCH (Stage 2).
          Canonical call shape documented at literature.citation_tallies.
    fallback:
      - tool: crossref_lookup
        notes: "Crossref REST via WebFetch — DOI resolution + journal ISSN start year for volume-year sanity"
      - tool: mcp__openalex__batch_resolve_references  # OpenAlex MCP
        notes: >
          Bulk DOI/title → canonical work resolution across 240M+ works. Call BEFORE
          declaring CITATION_NOT_FOUND when PubMed + Crossref both miss — OpenAlex
          covers cross-disciplinary works (CS, physics, social sciences) where PubMed
          has no coverage. Returns OpenAlex Work IDs + canonical metadata for any
          resolved entries.
      - tool: mcp__openalex__search_works  # OpenAlex MCP
        notes: "Free-text fallback when batch_resolve_references can't match by identifier; useful for fuzzy title-based retrieval."
    local:
      - tool: resolve_citation.py
        notes: "skills/research-accuracy-verifier/scripts/ — offline shape + plausibility checks before live lookup"

  claim_alignment:
    description: "Verify cited source actually supports the claim attributed to it (Stage 3)"
    primary:
      - tool: pmc_fetch
        notes: "PMC open-access full text retrieval via WebFetch"
    fallback:
      - tool: paperclip search  # Paperclip CLI or MCP — see PAPERCLIP TRANSPORTS
        notes: >
          When PMC fetch returns paywall / 404, attempt OA full-text retrieval via
          `paperclip lookup doi <DOI>` (preferred when DOI is known) or
          `paperclip search "<title>" -n 1`. Read the relevant section files under
          `/papers/<id>/sections/` or grep `content.lines` for the claim phrase.
          Higher-fidelity than Scite snippets for claim-alignment because full
          context is available. Skip if cited paper is not in Paperclip's 8-source
          corpus (PMC + bioRxiv + medRxiv + arXiv + abstracts + FDA + trials + patents).
          See literature.corpus_search.
      - tool: search_literature  # Scite MCP (mcp__scite__search_literature)
        notes: >
          Call with `dois=[<DOI>] + term=<key claim phrase>` for sentiment-classified
          citing snippets (supporting / contrasting / mentioning). Use supporting
          snippets as evidence for VERIFIED; contrasting snippets as evidence for
          CONTRADICTED or OVERGENERALIZED. Bias caveat: tag all sentiment results
          "per Scite classification" — see literature.citation_context notes
          for the documented bias toward 'mentioning'.
      - tool: pubmed_abstract
        notes: "Abstract-only check when full text unavailable; mark UNVERIFIED for full-text-required claims"
      - tool: mcp__openalex__get_citation_network  # OpenAlex MCP
        notes: >
          Backstop when Scite returns empty for a DOI: traverse OpenAlex citation
          network to surface citing/cited works that may anchor the claim, even
          without sentiment classification. Mark evidence as 'unsentenced citation
          context (per OpenAlex)' to distinguish from Scite's classified snippets.

  venue_quality:
    description: "Assess journal/venue credibility (Stage 2 sub-check) — surfaces predatory or low-quality venues as a sub-reason on METADATA_MISMATCH"
    primary:
      - tool: mcp__openalex__check_venue_quality  # OpenAlex MCP
        notes: >
          Returns OpenAlex venue quality signals (DOAJ membership, indexing status,
          h-index, works/year, openness). Call AFTER citation_existence resolves a
          DOI/work — if quality signals indicate predatory or non-indexed venue,
          attach as sub-reason on METADATA_MISMATCH (do NOT introduce a new verdict
          subtype). Verdict stays METADATA_MISMATCH; finding `evidence[]` records
          the venue concern with OpenAlex source URL.
      - tool: mcp__openalex__get_top_venues_for_field  # OpenAlex MCP
        notes: "Use when assessing whether a venue is reasonable for the paper's claimed field; comparison against top-N venues for the field disambiguates 'unfamiliar but legitimate' from 'predatory'."
    fallback: []

  cherry_picking:
    description: "Stage 4 Tier-3 cherry-picking detection — flag VERIFIED cite-claim pairs whose cited paper has a heavily contested citation tally"
    primary:
      - tool: search_literature  # Scite MCP (mcp__scite__search_literature)
        notes: >
          Call with `dois=[<cited DOI>]` (no `term`) to fetch tallies; compute
          USI = supporting / (supporting + contrasting). USI < 0.5 (matches
          deep-research's CONTESTED threshold) → emit OVERGENERALIZED finding
          flagging the implicit consensus framing (the narrow cite-claim pair
          remains VERIFIED). See literature.citation_tallies for canonical
          parameters and return shape.
    fallback: []

  exact_quote:
    description: "Exact-string + whitespace-normalized match of a quoted passage in source text (Stage 5)"
    # Routing within this capability (precedence): if the source is provided, run `local`
    # (verify_exact_quote.py) first. If sources_available == "none" or the local script
    # returns QUOTE_FABRICATED in biomedical context, escalate to `primary` (Paperclip
    # corpus grep) before falling back to `fallback` (web search).
    primary:
      - tool: paperclip grep  # Paperclip CLI or MCP — see PAPERCLIP TRANSPORTS
        notes: >
          When `sources_available == "none"` (biomedical context), or when verify_exact_quote.py
          returns QUOTE_FABRICATED for a quote that may simply be misattributed to the wrong
          paper, run a corpus-wide exact-phrase grep over full text: `paperclip grep -F
          "<exact passage>" /papers/`. Returns paper IDs and line refs across the entire
          indexed corpus — the discovered true source is recorded via the citation URL
          `https://citations.gxl.ai/papers/<doc_id>#L<n>` in the finding's `evidence[]`.
          Verdict stays `QUOTE_FABRICATED`; remediation guidance changes to "re-attribute
          to <discovered source>." See literature.corpus_grep for full CLI surface. Skip
          if non-biomedical or Paperclip absent.
    local:
      - tool: verify_exact_quote.py
        notes: "skills/research-accuracy-verifier/scripts/ — deterministic; returns QUOTE_VERIFIED|QUOTE_PARAPHRASED|QUOTE_FABRICATED. Run first when source is provided."
    fallback:
      - tool: web_search
        notes: "Quoted-phrase web search when no source provided and Paperclip unavailable / non-biomedical context."

  figure_content:
    description: "VLM analysis of paper figures via Paperclip ask-image — verify claims of the form 'Figure N shows X'"
    primary:
      - tool: paperclip ask-image  # Paperclip CLI or MCP — see PAPERCLIP TRANSPORTS
        notes: >
          `paperclip ask-image /papers/<id>/figures/<file> "<question>"`. Two built-in
          fns: `--fn describe` (default question: what does this figure show?) and
          `--fn extract-data` (tabular data extraction from plots/charts). Use for
          "Figure N shows downregulation of X" alignment in Stage 3 and for numerical
          claims read off a figure axis. Cite via the citation URL with the figure
          file path appended (e.g., `https://citations.gxl.ai/papers/<id>/figures/<file>`).
          Skip if Paperclip absent, paper outside the 8-source corpus, or `/papers/<id>/figures/`
          empty. Capability key alternative when no figure exists: fall back to text-only
          alignment via `verification.claim_alignment`.
    tooluniverse: []
    fallback: []  # No equivalent VLM-over-paper-figure tool — degrade to text alignment

  entity_sanity:
    description: "Stage 6 named-entity sanity (gene/protein/drug/cell-line/strain) — delegates to entity-resolution"
    delegate:
      - skill: entity-resolution
        notes: "Canonical resolver; HGNC/UniProt/Cellosaurus/Jackson via MCP tools"
    local:
      - tool: resolve_entity.py
        notes: "skills/research-accuracy-verifier/scripts/ — offline shape + known-collision check before delegation"

  internal_consistency:
    description: "Stage 7 internal consistency (refs ↔ inline citations, acronym definition order)"
    local:
      - tool: reconcile_references.py
        notes: "skills/research-accuracy-verifier/scripts/ — bibliography ↔ inline cite set diff"
      - tool: scan_acronyms.py
        notes: "skills/research-accuracy-verifier/scripts/ — undefined-first-use + expansion drift"

  semantic_web_search:
    description: "Stage 2/3 last-fallback semantic web search for non-DOI content (Exa MCP) + Stage 5 quote-fabrication rescue"
    # Routing: Exa is the documented concrete tool for the trailing `web` slot in
    # SKILL.md Stage 2/3 routing (biomedical: …→ Scite → Exa; general scientific:
    # OpenAlex → Exa → WebSearch). Use when scholarly indices return empty AND the
    # claim plausibly lives on a citable web domain (regulatory, registry, society,
    # *.edu, curated media). Web evidence has no DOI — P7 carve-out applies:
    # verification_path[] entry MUST include `method: "web_search"` (existing enum
    # value in schemas/finding.json) and `result_summary` containing the literal
    # token `no_doi` (otherwise validate_finding.py raises a P7 violation under
    # the carve-out). P8 carve-out: emit a `header.coverage_caveats[]` entry of
    # shape `cherry_picking:<claim_id>: web_source_no_doi_for_scite_tally` instead
    # of a Stage-4 cherry-picking finding. Citable-domain rules at
    # skills/shared/references/citable_web_domains.md (W1/W2/W3 trust tiers).
    primary:
      - tool: mcp__exa__web_search_exa
        notes: >
          Natural-language page-description query (NOT keywords) +
          `numResults` (default 10). Returns clean text content from top results.
          Use category:people / category:company filters when claim is about a
          named individual or organization.
      - tool: mcp__exa__web_fetch_exa
        notes: >
          Batch-fetch full markdown for one or more URLs surfaced by
          web_search_exa when result highlights are insufficient. Capture
          `fetched_at` ISO-8601 timestamp into verification_path[].result_summary.
    fallback:
      - tool: WebSearch
        notes: "Deeper fallback when Exa returns empty (regional restriction, rate limit, or query truly off-corpus). Quote-fabrication rescue path also uses Exa first, WebSearch second."

discovery:
  web_grey_literature:
    description: "Deep-research WebSemantic channel — grey-literature + non-indexed web discovery for the bibliography agent (Exa MCP)"
    # Used by deep-research's WebSemantic channel (search_contract.py). Required
    # in full / lit-review / hypothesis / fact-check modes; opt-in only for
    # systematic-review (PRISMA-S §S4 disclosure required if enabled).
    # Bibliography entries from this channel MUST be in the W1/W2 tier of
    # skills/shared/references/citable_web_domains.md and carry a `[Grey Lit]`
    # tag + `fetched_at` ISO-8601 timestamp. W3 hits (curated media) enter the
    # report as `[Context]` only, never as bibliography entries. Out-of-whitelist
    # hits are dropped from the bibliography entirely.
    primary:
      - tool: mcp__exa__web_search_exa
        notes: >
          Discovery call: natural-language page-description query targeting
          grey-lit (regulatory letters, EMA assessment reports, NICE guidance,
          conference abstracts, sponsor disclosures, registry pages). Filter
          results against citable_web_domains whitelist before promoting to
          bibliography. Fact-check mode auto-hardens this channel when the
          research question contains regulatory-entity tokens (FDA, EMA, recall,
          withdrawal, retraction, EUA, etc.).
      - tool: mcp__exa__web_fetch_exa
        notes: "Markdown fetch for whitelisted URLs to capture snippet + fetched_at into the Search Log. Batch URLs in one call."
    fallback: []
