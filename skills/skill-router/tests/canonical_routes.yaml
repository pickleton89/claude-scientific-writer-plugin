# Canonical Routing Test Cases
# Version: 1.0.0
# Purpose: Validate deterministic routing produces expected results
#
# Test case structure:
#   request: The user's natural language request
#   expected_skill: The skill that should be selected
#   min_confidence: Minimum acceptable confidence score (0.5 = standard, 0.6+ = high signal)
#   category: Expected category classification
#   notes: Optional explanation for edge cases
#
# Confidence guidelines:
#   0.5 = Standard threshold (2 keyword matches OR 1 trigger)
#   0.6 = Elevated (3+ keyword matches OR multiple triggers)
#   0.7 = High (4+ matches with strong triggers) - rare

